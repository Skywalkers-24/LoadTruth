# Render Blueprint for the LoadTruth FastAPI backend.
# Connect this repository in Render; pushes to main deploy immediately.
services:
  - type: web
    name: loadtruth-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false # Supabase session-pooler URL, converted to postgresql+asyncpg.
      - key: MODEL_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: loadtruth-cache
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # The deployed Cloudflare Worker origin, e.g. https://loadtruth-console.example.workers.dev
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_S3_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: PIPELINE_RESULT_CACHE_ENABLED
        value: "true"
      - key: API_CACHE_ENABLED
        value: "true"
      - key: ANALYSIS_MAX_BYTES
        value: "20971520"
      - key: DEMO_UPLOAD_MAX_BYTES
        value: "104857600"
      - key: MODEL_API_LOG_PATH
        value: /tmp/loadtruth/meta_api.jsonl
  - type: keyvalue
    name: loadtruth-cache
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList: [] # Render services in this workspace connect over the private network.
