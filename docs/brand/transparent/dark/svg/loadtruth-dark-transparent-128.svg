<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="190 310 760 530" role="img" aria-labelledby="title desc">
<title id="title">LoadTruth verified truck – dark theme</title>
<desc id="desc">A minimal, original, forward-facing dump truck graphic with a verified check mark inside its raised load bed.</desc>
<defs>
  <linearGradient id="tile" x1=".02" y1="1" x2=".96" y2="0" gradientUnits="objectBoundingBox">
   <stop offset="0" stop-color="#06132A"/><stop offset=".58" stop-color="#041222"/><stop offset="1" stop-color="#063A4C"/>
  </linearGradient>
  <radialGradient id="aura" cx="50%" cy="50%" r="55%">
   <stop offset="0" stop-color="#00F2C1" stop-opacity=".55"/><stop offset="1" stop-color="#00F2C1" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="frame" x1="0" y1="1" x2=".85" y2="0">
   <stop offset="0" stop-color="#1884F4"/><stop offset=".56" stop-color="#39DEFA"/><stop offset="1" stop-color="#A4FFFF"/>
  </linearGradient>
  <linearGradient id="bed" x1="0" y1="1" x2="1" y2="0">
   <stop offset="0" stop-color="#1265A9"/><stop offset=".56" stop-color="#09AFA7"/><stop offset="1" stop-color="#19F9BC"/>
  </linearGradient>
  <linearGradient id="wheel" x1="0" y1="0" x2=".9" y2="1">
   <stop offset="0" stop-color="#12C8E9"/><stop offset=".55" stop-color="#0562C3"/><stop offset="1" stop-color="#064283"/>
  </linearGradient>
  <filter id="subtleShadow" x="-25%" y="-25%" width="150%" height="150%">
   <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/>
   <feOffset dy="10" result="off"/>
   <feComponentTransfer in="off" result="alpha"><feFuncA type="linear" slope=".25"/></feComponentTransfer>
   <feMerge><feMergeNode in="alpha"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<g filter="url(#subtleShadow)">
  <!-- Raised dump bed: distinct green-to-teal audited load -->
  <path d="M375 378 L795 330 Q806 327 800 342 L678 570 Q670 591 650 592 H309 Z" fill="url(#bed)"/>
  
   <path d="M307 618 L635 619" fill="none" stroke="#A4FFFF" stroke-opacity=".45" stroke-width="9" stroke-linecap="round"/>
   <path d="M347 397 L748 346" fill="none" stroke="#A4FFFF" stroke-opacity=".52" stroke-width="8" stroke-linecap="round"/>
   <path d="M767 512 L843 510" stroke="#A4FFFF" stroke-opacity=".7" stroke-width="8" stroke-linecap="round"/>
   <path d="M785 653 H862" stroke="#1884F4" stroke-width="11" stroke-linecap="round" opacity=".4"/>
 
  <!-- Integrated blue chassis and right-facing cab, one contiguous silhouette -->
  <path d="M216 677 L293 399 Q299 382 316 379 L375 371 L301 629 H709 L752 496 Q758 485 776 485 H841 Q878 485 897 521 L931 591 Q936 602 934 616 L918 680 Q915 699 893 699 H704 L670 788 Q666 802 651 802 H578 Q560 802 566 785 L588 699 H236 Q209 699 216 677 Z" fill="url(#frame)"/>
  <!-- Clear window shape -->
  <path d="M795 526 Q796 519 804 519 H842 Q859 519 868 535 L898 593 Q904 607 891 607 H774 Z" fill="#061D36" stroke="#71F1FC" stroke-width="5" stroke-linejoin="round"/>
  <!-- Inset cutout below front bumper -->
  <path d="M721 664 H898" stroke="#A4FFFF" opacity=".42" stroke-width="6" stroke-linecap="round"/>
  <!-- Two wheels -->
  <circle cx="370" cy="763" r="61" fill="url(#wheel)"/>
  <circle cx="808" cy="763" r="61" fill="url(#wheel)"/>
  <circle cx="353" cy="744" r="14" fill="#A4FFFF" opacity=".13"/><circle cx="791" cy="744" r="14" fill="#A4FFFF" opacity=".13"/>
  <!-- Verified load: very bold, visible even at 16px -->
  <path d="M462 483 L510 530 L612 428" fill="none" stroke="#E8FFFF" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
