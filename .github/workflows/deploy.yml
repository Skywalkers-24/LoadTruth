name: Deploy

# Free-tier deploy. Disabled by default (runs only via manual dispatch) so it
# never burns Actions minutes or fails on missing secrets until we opt in.
# Target: Fly.io free allowance for the backend + worker, Vercel/Cloudflare
# Pages free tier for the frontend, Supabase free tier for DB/storage.
# See docs/DEPLOYMENT.md.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        type: choice
        options: [backend, frontend, both]
        default: both

jobs:
  deploy-backend:
    if: ${{ inputs.target == 'backend' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Fly.io
        if: ${{ secrets.FLY_API_TOKEN != '' }}
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fly deploy
        if: ${{ secrets.FLY_API_TOKEN != '' }}
        run: flyctl deploy --remote-only --config fly.backend.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Skip notice
        if: ${{ secrets.FLY_API_TOKEN == '' }}
        run: echo "FLY_API_TOKEN not set — skipping backend deploy."

  deploy-frontend:
    if: ${{ inputs.target == 'frontend' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          npm i -g vercel
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Skip notice
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: echo "VERCEL_TOKEN not set — skipping frontend deploy."
