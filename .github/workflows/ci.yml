name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save free-tier minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy --strict app
      - name: Bandit (security)
        run: bandit -q -r app
      - name: Pytest + coverage
        env:
          LOADTRUTH_SKIP_STARTUP_DB: "1"
          MOCK_AI: "1"
        run: pytest --cov=app --cov-report=term-missing
      - name: Root tests + Evaluation benchmarks
        run: |
          cd ..
          pytest tests/ -q
          python -m eval.runner

  frontend:
    name: Frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Prettier (changed files)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base "origin/$GITHUB_BASE_REF" "$GITHUB_SHA")"
          else
            base="$GITHUB_EVENT_BEFORE"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR --relative "$base" "$GITHUB_SHA" -- . | grep -E '\.(c|m)?(js|jsx|ts|tsx|json|jsonc|md|css|scss|html)$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --check "${files[@]}"
          else
            echo "No changed Prettier-supported files."
          fi
      - name: Unit tests
        run: npm run test
      - name: Build
        env:
          BACKEND_URL: https://loadtruth-api.onrender.com
        run: npm run cf:build

  docker:
    name: Docker images (build & publish)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/loadtruth-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/loadtruth-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old backend images (keep latest 5)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'loadtruth-backend'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'false'

      - name: Prune old frontend images (keep latest 5)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'loadtruth-frontend'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'false'
