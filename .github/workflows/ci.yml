name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save free-tier minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy --strict app
      - name: Bandit (security)
        run: bandit -q -r app
      - name: Pytest + coverage
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Prettier (changed files)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base "origin/$GITHUB_BASE_REF" "$GITHUB_SHA")"
          else
            base="$GITHUB_EVENT_BEFORE"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR --relative "$base" "$GITHUB_SHA" -- . | grep -E '\.(c|m)?(js|jsx|ts|tsx|json|jsonc|md|css|scss|html)$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --check "${files[@]}"
          else
            echo "No changed Prettier-supported files."
          fi
      - name: Unit tests
        run: npm run test
      - name: Build
        env:
          BACKEND_URL: https://loadtruth-api.onrender.com
        run: npm run cf:build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
